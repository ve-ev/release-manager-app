name: PR checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to the pull request cancels the run for the previous push
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install from the lockfile: plain install can lose Rollup's platform binary
      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # tsc, vite build, and youtrack-app validate of the app package
      - name: Build
        run: npm run build
